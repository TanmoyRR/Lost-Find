{% extends 'base/dashboard_base.html' %}
{% load static %}

{% block page_title %}Scan QR Code{% endblock %}

{% block dashboard_content %}
<div class="max-w-lg mx-auto space-y-6 animate-fade-in">
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
        <h1 class="text-2xl font-bold text-gray-900 mb-2">Scan QR Code</h1>
        <p class="text-gray-600 mb-6">Enter the QR code token to verify the recovery session.</p>

        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">QR Token</label>
                <input type="text" name="qr_token" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                    placeholder="Paste or scan the QR token...">
            </div>
            <button type="submit" class="w-full px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition">
                <i class="bi bi-qr-code-scan"></i> Verify QR Code
            </button>
        </div>
    </div>
</div>
{% endblock %}
