{% extends 'base/base.html' %}
{% load static %}

{% block title %}Report Item - Lost & Found{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-12 animate-fade-in">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
        <div class="text-center mb-6">
            <div class="w-16 h-16 rounded-2xl bg-red-100 flex items-center justify-center mx-auto mb-4">
                <i class="bi bi-flag text-red-600 text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-900">Report Item</h1>
            <p class="text-gray-600 mt-1">Report a concern about: <strong>{{ post.title }}</strong></p>
        </div>

        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Report Type</label>
                <select name="report_type" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-red-400 focus:ring-2 focus:ring-red-200 outline-none transition">
                    <option value="">Select a reason</option>
                    <option value="spam">Spam</option>
                    <option value="fake">Fake Listing</option>
                    <option value="harassment">Harassment</option>
                    <option value="scam">Scam / Fraud</option>
                    <option value="duplicate">Duplicate</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                <textarea name="description" rows="4" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-red-400 focus:ring-2 focus:ring-red-200 outline-none transition" placeholder="Describe the issue..."></textarea>
            </div>
            <div class="flex items-center gap-3 pt-2">
                <a href="{% url 'posts:detail' post.pk %}" class="px-6 py-2.5 rounded-xl text-sm font-medium text-gray-600 hover:bg-gray-50 transition">Cancel</a>
                <button type="submit" class="px-6 py-2.5 rounded-xl text-sm font-medium bg-red-600 text-white hover:bg-red-700 transition flex items-center gap-2">
                    <i class="bi bi-send"></i> Submit Report
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
