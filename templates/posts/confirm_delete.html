{% extends 'base/dashboard_base.html' %}
{% load static %}

{% block page_title %}Delete Post{% endblock %}

{% block dashboard_content %}
<div class="max-w-lg mx-auto animate-fade-in">
    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-8 text-center">
        <div class="w-20 h-20 rounded-2xl bg-red-100 flex items-center justify-center mx-auto mb-6">
            <i class="bi bi-exclamation-triangle text-4xl text-red-500"></i>
        </div>
        <h1 class="text-2xl font-bold text-gray-900 mb-2">Delete Post</h1>
        <p class="text-gray-500 mb-2">Are you sure you want to delete this post?</p>
        <p class="text-sm font-medium text-gray-700 mb-6 p-3 rounded-xl bg-gray-50">
            "{{ post.title }}"
        </p>
        <p class="text-xs text-red-500 mb-8 flex items-center justify-center gap-1">
            <i class="bi bi-info-circle"></i> This action cannot be undone.
        </p>

        <form method="POST" class="flex items-center justify-center gap-3">
            {% csrf_token %}
            <a href="{% url 'posts:detail' post.pk %}" class="px-6 py-3 rounded-xl text-sm font-medium text-gray-600 hover:bg-gray-100 transition">
                Cancel
            </a>
            <button type="submit" class="gradient-danger text-white px-8 py-3 rounded-xl text-sm font-semibold hover:shadow-lg hover:shadow-red-500/25 transition flex items-center gap-2">
                <i class="bi bi-trash"></i> Delete Post
            </button>
        </form>
    </div>
</div>
{% endblock %}
